---
- name: Vérifier si Docker est déjà installé
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Installer Docker
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
  when: docker_check.rc != 0

- name: Installer le SDK Python pour Docker (utilisé par Ansible)
  ansible.builtin.apt:
    name: python3-docker
    state: present

- name: Vérifier que Docker est démarré et activé au boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Créer le volume de données de Portainer
  community.docker.docker_volume:
    name: portainer_data

- name: Démarrer Portainer
  community.docker.docker_container:
    name: portainer
    image: "{{ portainer_image }}"
    state: started
    restart_policy: always
    ports:
      - "{{ portainer_port }}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
