---
- name: Installer Docker, Portainer, Jenkins et le conteneur web
  hosts: ftpserver
  become: true

  tasks:
    # ---------- Docker ----------
    - name: Vérifier si Docker est déjà installé
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Installer Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true
      when: docker_check.rc != 0

    - name: Installer le SDK Python pour Docker (utilisé par Ansible)
      ansible.builtin.apt:
        name: python3-docker
        state: present

    - name: Vérifier que Docker est démarré et activé au boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # ---------- Portainer ----------
    - name: Créer le volume de données de Portainer
      community.docker.docker_volume:
        name: portainer_data

    - name: Démarrer Portainer
      community.docker.docker_container:
        name: portainer
        image: portainer/portainer-ce:lts
        state: started
        restart_policy: always
        ports:
          - "9443:9443"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - portainer_data:/data
          
    # ---------- Jenkins ----------
    - name: Lire la liste des paquets installés
      ansible.builtin.package_facts:
        manager: apt

    - name: Installer Jenkins s'il est absent
      when: "'jenkins' not in ansible_facts.packages"
      block:
        - name: Installer Java
          ansible.builtin.apt:
            name: openjdk-21-jre
            state: present
            update_cache: true

        - name: Ajouter la clé du dépôt Jenkins
          ansible.builtin.get_url:
            url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
            dest: /etc/apt/keyrings/jenkins-keyring.asc
            mode: '0644'

        - name: Ajouter le dépôt Jenkins
          ansible.builtin.apt_repository:
            repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
            state: present

        - name: Installer Jenkins
          ansible.builtin.apt:
            name: jenkins
            state: present
            update_cache: true

    - name: Vérifier que Jenkins est démarré et activé au boot
      ansible.builtin.service:
        name: jenkins
        state: started
        enabled: true

    - name: Vérifier que Jenkins répond sur le port 8080
      ansible.builtin.uri:
        url: http://localhost:8080/login
        status_code: [200, 403]
      register: jenkins_http
      retries: 12
      delay: 5
      until: jenkins_http.status in [200, 403]

    # ---------- Conteneur web (docker compose) ----------
    - name: Vérifier si le plugin Docker Compose est présent
      ansible.builtin.command: docker compose version
      register: compose_check
      changed_when: false
      failed_when: false

    - name: Installer le plugin Docker Compose
      ansible.builtin.apt:
        name: docker-compose-v2
        state: present
      when: compose_check.rc != 0

    - name: Créer le dossier du projet web
      ansible.builtin.file:
        path: /opt/demo-web
        state: directory
        mode: '0755'

    - name: Copier le docker-compose.yml
      ansible.builtin.copy:
        src: docker-compose.yml
        dest: /opt/demo-web/docker-compose.yml
        mode: '0644'

    - name: Démarrer le conteneur web
      community.docker.docker_compose_v2:
        project_src: /opt/demo-web
        state: present